# Default configuration.
# Any key can be overridden by a JVM system property (-Dkey=value)
# or an environment variable (key upper-cased, dots -> underscores, e.g. IOS_DEVICE_NAME).

# android | ios | api
platform=android
appium.url=http://127.0.0.1:4723
timeout.seconds=15
retry.count=0

# Android (UiAutomator2)
android.device.name=Android Emulator
android.udid=
android.app=apps/android.apk
android.app.package=com.saucelabs.mydemoapp.rn

# iOS (XCUITest) - simulator build only
ios.device.name=iPhone 16
ios.platform.version=
ios.udid=
ios.app=apps/MyDemoApp.app
ios.bundle.id=com.saucelabs.mydemoapp.rn

# Deep link scheme of Sauce Labs My Demo App (React Native)
app.deeplink.scheme=mydemoapprn://

# API under test (backend of a demo e-commerce store)
api.base.url=https://dummyjson.com

# Allure report evidence
# screenshot (compressed JPEG) attached to every step
allure.step.screenshots=true
# Android screen recording attached to failed tests
allure.video.on.failure=true
