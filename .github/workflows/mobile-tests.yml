name: Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1-5" # nightly regression, Mon-Fri 03:00 UTC
  workflow_dispatch:
    inputs:
      platform:
        description: "What to run"
        type: choice
        options: [all, api, android, ios]
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  APPIUM_VERSION: "3"
  RETRY_COUNT: "1"

jobs:
  api:
    name: API tests
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","api"]'), inputs.platform)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run API tests
        run: mvn -B test -Papi -Dretry.count=${RETRY_COUNT}

      - name: Tag Allure results
        if: always()
        run: bash scripts/tag-allure-results.sh target/allure-results api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-api
          path: target/allure-results
          retention-days: 7

  android:
    name: Android API ${{ matrix.api-level }}
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","android"]'), inputs.platform)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium@${APPIUM_VERSION}
          appium driver install uiautomator2
          appium --version
          appium driver list --installed

      - name: Download app under test
        run: bash scripts/download-apps.sh android

      - name: Resolve Maven dependencies
        run: mvn -B -q test-compile

      - name: Start Appium server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log-timestamp --log appium.log > /dev/null 2>&1 &
          bash scripts/wait-for-appium.sh

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: mvn -B test -Pandroid -Dretry.count=${RETRY_COUNT} -Dandroid.udid=emulator-5554

      - name: Tag Allure results
        if: always()
        run: bash scripts/tag-allure-results.sh target/allure-results android-${{ matrix.api-level }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-android-${{ matrix.api-level }}
          path: target/allure-results
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: appium-log-android-${{ matrix.api-level }}
          path: appium.log
          retention-days: 7

  ios:
    name: iOS simulator
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","ios"]'), inputs.platform)
    # Intel runner: the demo app simulator build is x86_64
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium@${APPIUM_VERSION}
          appium driver install xcuitest
          appium --version

      - name: Download app under test
        run: bash scripts/download-apps.sh ios

      - name: Boot iPhone simulator
        run: bash scripts/boot-ios-simulator.sh

      - name: Pre-build WebDriverAgent
        # Building WDA inside the first test session can exceed session timeouts on CI.
        # Build it once up front; DerivedData is reused by every session.
        continue-on-error: true
        timeout-minutes: 30
        run: appium driver run xcuitest build-wda

      - name: Resolve Maven dependencies
        run: mvn -B -q test-compile

      - name: Start Appium server
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log-timestamp --log appium.log > /dev/null 2>&1 &
          bash scripts/wait-for-appium.sh

      - name: Run tests on simulator
        run: mvn -B test -Pios -Dretry.count=${RETRY_COUNT}

      - name: Tag Allure results
        if: always()
        run: bash scripts/tag-allure-results.sh target/allure-results ios-${IOS_PLATFORM_VERSION:-sim}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ios
          path: target/allure-results
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: appium-log-ios
          path: appium.log
          retention-days: 7

  report:
    name: Allure report
    needs: [api, android, ios]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      ALLURE_VERSION: "2.32.0"
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Add environment and executor info
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties <<EOF
          Android.App=Sauce Labs My Demo App RN 1.3.0
          Android.Emulators=API 30, API 34 (pixel_6)
          iOS=Latest iPhone simulator on macos-15-intel
          API=https://dummyjson.com
          Appium=${APPIUM_VERSION}.x
          Java=${JAVA_VERSION}
          Branch=${GITHUB_REF_NAME}
          EOF
          cat > allure-results/executor.json <<EOF
          {"name":"GitHub Actions","type":"github","buildName":"Run #${GITHUB_RUN_NUMBER}","buildUrl":"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}","reportName":"Mobile Tests"}
          EOF

      - name: Generate Allure report
        run: |
          curl -fsSL -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          ./allure-${ALLURE_VERSION}/bin/allure generate allure-results -o allure-report --clean

      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: allure-report

  deploy-report:
    name: Publish report to GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
